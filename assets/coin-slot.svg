<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 47 100" width="47" height="100">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="55%" stop-color="#222"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="50%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
  </defs>

  <!-- 金属外框 -->
  <rect x="1" y="1" width="45" height="98" rx="8" fill="url(#body)"
        stroke="url(#rim)" stroke-width="2.5"/>

  <!-- 硬币 -->
  <circle cx="23.5" cy="22" r="10" fill="url(#coin)" stroke="#92400e" stroke-width="1"/>
  <circle cx="23.5" cy="22" r="7" fill="none" stroke="#b45309" stroke-width="0.8" opacity="0.7"/>
  <path d="M23.5 17 L25 20.2 L28.4 20.5 L25.8 22.9 L26.6 26.3 L23.5 24.5 L20.4 26.3 L21.2 22.9 L18.6 20.5 L22 20.2 Z"
        fill="#b45309" opacity="0.85"/>

  <!-- 投币口 -->
  <rect x="8" y="41" width="31" height="5" rx="2.5" fill="#000"/>
  <rect x="8" y="41" width="31" height="1.6" rx="0.8" fill="#000" opacity="0.6"/>

  <!-- 投币: 下方留出充足余量, 不贴按键下缘 -->
  <text x="23.5" y="68" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="bold"
        fill="#fbbf24" text-anchor="middle">投</text>
  <text x="23.5" y="87" font-family="Microsoft YaHei,Arial" font-size="18" font-weight="bold"
        fill="#fbbf24" text-anchor="middle">币</text>
</svg>
